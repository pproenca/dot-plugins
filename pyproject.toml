[project]
name = "dot-plugins"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Correctness and import hygiene. UP031 is deliberately excluded: the validator
# uses %-formatting consistently and rewriting ~100 call sites buys nothing.
select = ["E", "F", "I", "B", "W"]
