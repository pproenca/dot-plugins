apiName: asset
displayName: Asset
description: >
  Anything valuable to the organization: equipment, software licences,
  real estate, financial instruments, and human assets.
primaryKey: assetId
titleProperty: assetId
properties:
  assetId:
    type: string
    description: Asset identifier.
    required: true
  assetType:
    type: string
    description: What kind of asset this is.
    constraints:
      enum: [equipment, softwareLicense, realEstate, financialInstrument, humanAsset]
  value:
    type: double
    description: Value of the asset. Meaning depends on assetType.
  location:
    type: string
    description: Location of the asset. Varies by assetType.
  status:
    type: string
    description: Status of the asset. Meaning varies by assetType.
