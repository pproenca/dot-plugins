apiName: asset
displayName: Asset
pluralDisplayName: Assets
description: A serviceable piece of plant the maintenance team is responsible for.
status: active
groups: [maintenance]
implements: [inspectable]
primaryKey: assetId
titleProperty: assetName
properties:
  assetId:
    type: string
    description: Stable asset identifier from the asset register.
    required: true
  assetName:
    type: string
    description: Name the maintenance team uses for this asset.
    required: true
  serialNumber:
    type: string
    description: Manufacturer serial number.
  commissionedDate:
    type: date
    description: Date the asset entered service.
  lastInspectionDate:
    type: timestamp
    description: >
      Most recent completed inspection. Satisfies the inspectable interface. Empty on a
      newly commissioned asset, rather than carrying a sentinel date.
  inspectionIntervalDays:
    type: integer
    description: Required number of days between inspections. Satisfies the inspectable interface.
    required: true
  workOrderCount:
    type: integer
    description: >
      How many work orders have ever been raised against this asset, in any state.
      Not a backlog figure: derived aggregations take no predicate, so completed and
      cancelled work is included.
    derived: true
    via: [workOrderAsset]
    aggregation: count
    derivation: Counts linked work orders; storing it would go stale on every raise.
