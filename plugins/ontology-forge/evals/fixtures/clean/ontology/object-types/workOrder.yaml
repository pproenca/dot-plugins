apiName: workOrder
displayName: Work Order
pluralDisplayName: Work Orders
description: >
  A unit of maintenance work raised against an asset, from request through
  completion. One work order covers one asset and one intervention.
status: active
groups: [maintenance]
primaryKey: workOrderId
titleProperty: workOrderNumber
properties:
  workOrderId:
    type: string
    description: Stable identifier, sourced from the maintenance system.
    required: true
  workOrderNumber:
    type: string
    description: Human-facing reference shown to technicians, e.g. WO-10423.
    required: true
  raisedDate:
    type: timestamp
    description: When the work order was raised.
    required: true
  completedDate:
    type: timestamp
    description: When the technician signed the work off. Null while open.
  workOrderStatus:
    type: string
    description: Lifecycle state of the work order.
    required: true
    constraints:
      enum: [draft, approved, inProgress, blocked, complete, cancelled]
  estimatedHours:
    type: double
    description: Planned technician hours. Null until the work order is approved.
  actualHours:
    type: double
    description: Technician hours actually spent, recorded at close. Null until closed.
  outcome:
    type: string
    description: How the work ended, recorded by the technician at close.
    constraints:
      enum: [resolved, partiallyResolved, referredOnward]
  closingNotes:
    type: string
    description: What the technician recorded about the job when signing it off.
