name: Deploy marketplace to GitHub Pages

on:
  workflow_run:
    workflows: [Release marketplace]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select latest release tag
        id: release
        shell: bash
        run: |
          latest_tag="$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -z "${latest_tag}" ]]; then
            echo "No v* release tag found" >&2
            exit 1
          fi
          git checkout --detach "${latest_tag}"
          echo "version=${latest_tag#v}" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build marketplace
        run: >-
          python scripts/build_marketplace_site.py
          --output _site
          --expected-version "${{ steps.release.outputs.version }}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
