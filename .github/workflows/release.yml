name: Release marketplace

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: craft-release-master
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master

      - name: Refresh tags and master
        run: |
          git fetch --force --tags origin master
          git checkout -B master origin/master

      - name: Check for releasable tree changes
        id: changes
        shell: bash
        run: |
          latest_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "${latest_tag}" ]] && git diff --quiet "${latest_tag}^{tree}" "HEAD^{tree}"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.changes.outputs.release == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install development dependencies
        if: steps.changes.outputs.release == 'true'
        run: uv sync --frozen

      - name: Set up Node.js for Codex compatibility checks
        if: steps.changes.outputs.release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install verified Craft 2.30.1
        if: steps.changes.outputs.release == 'true'
        shell: bash
        run: |
          craft_bin_dir="${RUNNER_TEMP}/craft-bin"
          mkdir -p "${craft_bin_dir}"
          craft_path="${craft_bin_dir}/craft"
          curl --fail --silent --show-error --location \
            https://github.com/getsentry/craft/releases/download/2.30.1/craft \
            --output "${craft_path}"
          echo "b28b71897f6d32cf8614df9b434f75aea766d35923020430906d09ad4fb87c05  ${craft_path}" \
            | sha256sum --check --strict
          chmod +x "${craft_path}"
          echo "${craft_bin_dir}" >> "$GITHUB_PATH"

      - name: Configure release identity
        if: steps.changes.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Select release version
        if: steps.changes.outputs.release == 'true'
        id: selection
        shell: bash
        run: |
          if [[ -z "${{ steps.changes.outputs.latest_tag }}" ]]; then
            echo "argument=0.15.0" >> "$GITHUB_OUTPUT"
          else
            echo "argument=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release branch locally
        if: steps.changes.outputs.release == 'true'
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: craft prepare "${{ steps.selection.outputs.argument }}" --no-input --no-push

      - name: Validate prepared release
        if: steps.changes.outputs.release == 'true'
        shell: bash
        run: |
          git checkout "${{ steps.prepare.outputs.branch }}"
          test "$(git branch --show-current)" = "${{ steps.prepare.outputs.branch }}"
          uv run pytest
          uv run ruff check .
          uv run python scripts/test_codex_plugins.py
          site_dir="$(mktemp -d)"
          uv run python scripts/build_marketplace_site.py --output "${site_dir}"
          git diff --exit-code
          test -z "$(git status --short)"

      - name: Push validated release branch
        if: steps.changes.outputs.release == 'true'
        run: git push origin "HEAD:refs/heads/${{ steps.prepare.outputs.branch }}"

      - name: Return to master
        if: steps.changes.outputs.release == 'true'
        run: git checkout master

      - name: Publish and merge release
        if: steps.changes.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          craft publish "${{ steps.prepare.outputs.version }}"
          --no-input
          --no-status-check
          --merge-target master
